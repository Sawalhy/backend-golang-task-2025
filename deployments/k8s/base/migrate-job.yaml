# Schema migrations, run once per deploy.
#
# A Job rather than an init container on all three Deployments. golang-migrate
# takes a Postgres advisory lock, so N pods racing to migrate is safe rather than
# corrupting — but it means a rolling update of six API replicas performs the
# schema change six times, five of them no-ops, and a failure surfaces as one pod
# among many crash-looping instead of one object with a non-zero exit code. The
# Deployments gate on the *result* instead, with a `migrate version` init
# container.
#
# Seeding is NOT here. It creates known accounts with known passwords
# (admin@example.com / admin12345), which is a demo fixture and a security hole
# depending only on where it runs. It lives in overlays/dev.
#
# Re-applying: a Job's pod template is immutable, so a second apply with a
# changed image is rejected while the old Job still exists. ttlSecondsAfterFinished
# garbage-collects it five minutes after it succeeds, which covers the normal
# case; inside that window, `kubectl delete job migrate -n order-processing`
# first. A production pipeline would generate the name from the image tag, or use
# an Argo PreSync / Helm pre-upgrade hook, so this never comes up.

apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: schema
spec:
  # The pod also has to survive Postgres not being up yet: the container exits
  # non-zero, the kubelet restarts it under restartPolicy, and this bounds how
  # long that can go on before the Job is declared failed rather than retrying
  # into next week.
  backoffLimit: 12
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: schema
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: order-processing:0.1.0
          imagePullPolicy: IfNotPresent
          # `up` is idempotent: migrate.ErrNoChange is treated as success, not
          # failure (cmd/migrate/main.go:102), so re-running against a current
          # schema exits 0 and this Job can be applied on every deploy.
          command: ["/app/migrate", "up"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
