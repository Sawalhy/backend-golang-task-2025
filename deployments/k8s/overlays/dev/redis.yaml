# Redis, and the one datastore here that gets a Deployment rather than a
# StatefulSet — because losing everything in it is harmless.
#
# It backs rate limiting and nothing else (DESIGN_NOTES §5.17). A restart resets
# every token bucket, which costs one window of over-permissive limiting and no
# data. The limiter also fails open when Redis is unreachable, on the grounds
# that rejecting every request would turn a cache outage into a full outage, so
# this pod being down degrades one middleware instead of stopping the system.
#
# Persistence is switched off deliberately rather than left at the default:
# fsyncing state that is worthless after a restart is pure write amplification.

apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "redis-server"
            # Empty save schedule: no RDB snapshots.
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
