# RabbitMQ for a laptop cluster. One node, no mirroring, no quorum queues — a
# real deployment uses a managed broker or the RabbitMQ Cluster Operator, both of
# which replace this file entirely.
#
# The queues and exchange are declared by the application at startup
# (internal/workers/broker.go), not here, so there is no topology to configure:
# every process re-declares what it needs on every reconnect, which is also what
# makes a broker restart recoverable rather than a manual repair.

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            # Sets the default user explicitly. `guest` is otherwise restricted
            # to loopback, so every connection from another pod would fail
            # authentication for reasons the client reports as a generic refusal.
            - secretRef:
                name: rabbitmq-auth
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              # check_port_connectivity, not check_running: it is the cheaper of
              # the diagnostics and it answers the question readiness actually
              # asks, which is whether a client can connect right now.
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 15
            # These diagnostics shell out to the Erlang runtime and routinely
            # take several seconds. The default 1s timeout marks a healthy broker
            # unready under load.
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
